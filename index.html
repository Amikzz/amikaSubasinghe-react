    <!-- ChatBot (Lazy Loaded for Performance) -->
    <script>
      const loadBotpress = () => {
        if (window.botpressInitialized) return;
        window.botpressInitialized = true;

        const injectScript = document.createElement("script");
        injectScript.src = "https://cdn.botpress.cloud/webchat/v3.2/inject.js";
        injectScript.onload = () => {
          const configScript = document.createElement("script");
          configScript.src =
            "https://files.bpcontent.cloud/2025/08/17/04/20250817042253-QIIF5PKR.js";
          document.head.appendChild(configScript);
        };
        document.head.appendChild(injectScript);
      };

      // Load on user interaction or after an 8s delay as fallback
      ["mousemove", "scroll", "keydown", "touchstart"].forEach((e) => {
        window.addEventListener(e, loadBotpress, { once: true, passive: true });
      });
      setTimeout(loadBotpress, 8000);
    </script>
