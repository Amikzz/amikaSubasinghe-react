name: Deploy React App to EC2

on:
  push:
    branches:
      - live

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout code
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Node
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20

      # 3. Install dependencies
      - name: Install dependencies
        run: npm install

      # 4. Build project (creates dist/)
      - name: Build project
        run: npm run build

      # 5. Deploy dist contents to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_KEY }}
          port: 22
          script: |
            sudo rm -rf /usr/share/nginx/html/myapp/*
            sudo cp -r dist/* /usr/share/nginx/html/myapp/
            sudo chown -R nginx:nginx /usr/share/nginx/html/myapp
            sudo chmod -R 755 /usr/share/nginx/html/myapp
            sudo systemctl restart nginx
